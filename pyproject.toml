[project]
name = "netvitals"
version = "0.0.5"
description = "Internet connection monitor for macOS"
readme = "README.md"
authors = [{ name = "pybass" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "aiohttp==3.14.3",
    "cyclopts==4.25.2",
    "dnspython==2.8.0",
    "psutil==7.2.2",
    "pyobjc-core==12.2.2 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa==12.2.2 ; sys_platform == 'darwin'",
    "rich==15.0.0",
    "textual==8.2.8",
]

[project.urls]
Repository = "https://github.com/pybass/netvitals"
Issues = "https://github.com/pybass/netvitals/issues"

[project.scripts]
netvitals = "netvitals.cli.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]  # pinned: build backends live outside uv.lock
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Linting & formatting
    "ruff~=0.16.6",
    # Type checking
    "mypy~=2.3.1",
    "types-psutil~=7.2.2.20260906",
    # Testing
    "pytest~=9.1.1",
    "pytest-xdist~=3.8.0",
    # Vulnerability audit
    "pip-audit~=2.10.1",
    # Git pre-commit hooks
    "pre-commit~=4.6.2",
]

[tool.uv]
required-version = ">=0.11"  # refuse a uv too old for the index/publish semantics we rely on
publish-url = "https://upload.pypi.org/legacy/"
check-url = "https://pypi.org/simple/"  # lets a failed release re-run: uploaded files are skipped

[tool.ruff]
line-length = 130
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Tool conflicts
    "COM812",   # trailing-comma — handled by ruff formatter
    "ISC001",   # implicit-string-concat — conflicts with ruff formatter
    "D203",     # conflicts with D211
    "D213",     # conflicts with D212
    # Style preferences
    "PLC0414",  # `import x as x` is our re-export marker
    "RET503",   # explicit None returns are noisy
    "G004",     # f-strings in logging are fine
    "PT001", "PT006", "PT007", "PT023",  # cosmetic pytest-style rules
    # Categories that fight our style
    "FIX",      # TODOs are fine
    "FBT",      # boolean-trap — too restrictive
    "EM",       # inline error messages are fine
    "CPY",      # no copyright headers — per-file headers add nothing
    "TC",       # TYPE_CHECKING blocks: import noise, break pydantic runtime annotations
    "TRY003",   # raise-vanilla-args — too noisy
    "C901",     # complexity — judgment call
    "PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004",  # soft pylint thresholds
    "TD002", "TD003",  # TODO author/link — optional
    "ASYNC109", # async-function-with-timeout — debatable
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator"]  # N805: cls is correct without @classmethod

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S", "SLF"]  # tests skip annotation, assert/security, and private-access rules

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "truthy-bool", "exhaustive-match", "unused-awaitable"]

[[tool.mypy.overrides]]
module = "tests.*"  # relaxed so pytest fixtures don't fight you
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["AppKit", "Foundation", "PyObjCTools", "PyObjCTools.*", "objc"]  # pyobjc ships no py.typed marker or stubs
ignore_missing_imports = true

[tool.codespell]
skip = "uv.lock,.git,.venv,.mypy_cache,.ruff_cache,.pytest_cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
xfail_strict = true
filterwarnings = ["error"]  # warnings are failures; targeted ignores go after "error"
